# Builds the Electron viewer and publishes it as the fixed prerelease "viewer". Launchers on Wine/Proton download it
# from there on first run. It runs when the Viewer folder changes (or by hand), not on every launcher release.
name: Publish viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Viewer/**'
      - '.github/workflows/publish-viewer.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ReStreet-Viewer.zip
        shell: pwsh
        run: ./Viewer/build-viewer.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash ReStreet-Viewer.zip -Algorithm SHA256).Hash.ToLower()
          "$h  ReStreet-Viewer.zip" | Out-File -Encoding ascii ReStreet-Viewer.zip.sha256

      - name: Publish release "viewer"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view viewer 2>$null
          if ($LASTEXITCODE -ne 0) {
            # Prerelease: the launcher's updater reads /releases/latest, which ignores prereleases.
            gh release create viewer --prerelease --title "Viewer (Wine/Proton)" --notes "Electron window for the launcher on Linux and Steam Deck. Downloaded automatically by the launcher; not an update."
          }
          gh release upload viewer ReStreet-Viewer.zip ReStreet-Viewer.zip.sha256 --clobber
