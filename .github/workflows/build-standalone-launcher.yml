name: Build Standalone launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the build at this repository (not committed)
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          foreach ($f in 'Launcher/FifaStreetLauncher/Updater.cs', 'Launcher/FifaStreetLauncher/ViewerDownload.cs') {
            (Get-Content $f -Raw).Replace('samuelit0davila/fifa-street-pc-port', $repo) |
              Set-Content $f -NoNewline -Encoding utf8
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the launcher
        shell: pwsh
        run: >
          dotnet publish Launcher/FifaStreetLauncher/FifaStreetLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/launcher

      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: dist/launcher
