# Seed clavier/souris pour les tests rapides (J4) — SANS manette.
# Copié vers <variante>/runtime/fifastreet.toml par scripts/play-keyboard.sh
# (création seule si absent ; le toml surcharge la ligne de commande).
# Référence rendu : windows-version/Installer/payload/Game/fifastreet.toml
# (non repris ici : chaque variante garde ses propres réglages GPU).
# Ne JAMAIS sauvegarder depuis F4 dans une variante de test (contamination).

mnk_mode = true
mnk_mouse = false
mnk_sensitivity = 1.0

